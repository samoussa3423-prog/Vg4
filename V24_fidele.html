async function analyzeLibraryPatterns(){
  const lib=await dbAll('library');
  if(!lib.length)return null;
  const patterns={nPlans:lib.length,totalShots:0,totalDuration:0,dureeMoyenne:0,noDialogue:0,pctPlansMuets:0,totalLines:0,totalWords:0,longueurReplique:0,camerasFrequentes:{}};
  for(const plan of lib){
    for(const scene of plan.scenes||[]){
      for(const shot of scene.shots||[]){
        patterns.totalShots++;
        patterns.totalDuration+=shot.duration||6;
        if(!shot.dialogue||!shot.dialogue.length)patterns.noDialogue++;
        for(const d of shot.dialogue||[]){
          patterns.totalLines++;
          patterns.totalWords+=(d.line||'').split(/\s+/).length;
        }
        if(shot.camera)patterns.camerasFrequentes[shot.camera]=(patterns.camerasFrequentes[shot.camera]||0)+1;
      }
    }
  }
  if(patterns.totalShots>0){
    patterns.dureeMoyenne=patterns.totalDuration/patterns.totalShots;
    patterns.pctPlansMuets=(patterns.noDialogue/patterns.totalShots)*100;
    patterns.longueurReplique=patterns.totalWords/Math.max(1,patterns.totalLines);
  }
  return patterns;
}

const libWords=t=>String(t||'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^a-z0-9 ]+/g,' ').split(/\s+/).filter(w=>w.length>3&&!LIB_STOP.has(w));
const CAM_CATS=[
 ['gros plan',/close-?up|gros plan|macro|extreme close/i],
 ['plan large',/wide|plan large|establishing|aerial|drone/i],
 ['zoom / push-in',/push-?in|zoom|dolly in|rapproch/i],

function libShots(e){const o=[];(e.scenes||[]).forEach(s=>(s.shots||[]).forEach(h=>{if(h.side!=='D')o.push(h)}));return o}
function shotLine(h){
  const img=(h.fid&&h.fid.image)||h.action||'';
  const dl=(h.dialogue||[]).map(d=>d.who+': « '+d.line+' »').join(' / ');
  return libClip(img,150)+(dl?' | '+libClip(dl,80):'');
}
function localFiche(e){
  const H=libShots(e),n=H.length;
  const f={n:n,total:0,avgDur:0,firstDur:0,pctDlg:0,wpl:0,cams:{},arc:[],hook:'',chute:''};
  if(!n)return f;
  let words=0,lines=0,dl=0;
  H.forEach(h=>{
    f.total+=h.duration||GROK_DEFAULT_DURATION;
    if((h.dialogue||[]).length){dl++;h.dialogue.forEach(x=>{lines++;words+=String(x.line||'').split(/\s+/).filter(Boolean).length})}
    camCats((h.fid&&h.fid.camera)||h.camera).forEach(c=>f.cams[c]=(f.cams[c]||0)+1);
    if(h.fid&&h.fid.emotion)f.arc.push(libClip(h.fid.emotion,40));
  });
  f.avgDur=f.total/n;f.firstDur=H[0].duration||GROK_DEFAULT_DURATION;f.pctDlg=dl/n*100;f.wpl=lines?words/lines:0;
  f.hook=shotLine(H[0]);f.chute=shotLine(H[n-1]);
  return f;
}
function libOutline(e,max){
  const H=libShots(e);let idx=H.map((_,i)=>i);
  if(H.length>max){idx=[];for(let k=0;k<max;k++)idx.push(Math.round(k*(H.length-1)/(max-1)))}
  return idx.map(i=>{const h=H[i],cam=libClip((h.fid&&h.fid.camera)||h.camera,40),em=h.fid&&h.fid.emotion?' | émotion: '+libClip(h.fid.emotion,30):'';
    return ' '+(i+1)+'. ('+(h.duration||GROK_DEFAULT_DURATION)+'s) '+cam+' | '+shotLine(h)+em}).join('\n');
}
function libAggregate(lib){
  const A={films:0,plans:0,total:0,avgDur:0,pctDlg:0,wpl:0,cams:{},avgPlans:0,avgFilmDur:0,avgFirst:0};
  let dl=0,lines=0,words=0,first=0;
  lib.forEach(e=>{
    const H=libShots(e);if(!H.length)return;
    A.films++;first+=(H[0].duration||GROK_DEFAULT_DURATION);
    H.forEach(h=>{
      A.plans++;A.total+=h.duration||GROK_DEFAULT_DURATION;
      if((h.dialogue||[]).length){dl++;h.dialogue.forEach(x=>{lines++;words+=String(x.line||'').split(/\s+/).filter(Boolean).length})}
      camCats((h.fid&&h.fid.camera)||h.camera).forEach(c=>A.cams[c]=(A.cams[c]||0)+1);
    });
  });
  if(A.plans){A.avgDur=A.total/A.plans;A.pctDlg=dl/A.plans*100;A.wpl=lines?words/lines:0;A.avgPlans=A.plans/A.films;A.avgFilmDur=A.total/A.films;A.avgFirst=first/A.films}
  return A;
}
function libScore(e,hw){
  const ia=e.ia||{},H=libShots(e);
  const base=new Set(libWords([e.title,(e.chars||[]).map(c=>c.desc).join(' '),H.map(h=>(h.fid&&h.fid.image)||h.action||'').join(' '),H.map(h=>(h.dialogue||[]).map(d=>d.line).join(' ')).join(' ')].join(' ')));
  const tags=new Set(libWords([ia.genre,(ia.themes||[]).join(' '),ia.hook].join(' ')));
  let s=0;hw.forEach(w=>{if(base.has(w))s+=1;if(tags.has(w))s+=3});
  return s+(e.star?6:0)+Math.random()*0.9;
}

/* API GROK */
async function grokFetch(url,options={}){
  if(!KEYS.useGrok||!KEYS.grok)throw new Error('Grok désactivé ou clé absente (étape 1 · Clés)');
  let lastErr;
  for(let a=0;a<4;a++){
    if(TASK&&TASK.stop)throw new Error('stop');
    try{
      const r=await fetch(url,options);
      if(r.ok)return r;
      if(r.status===429||r.status>=500){await sleep(Math.min(60,5*Math.pow(2,a))*1000);lastErr=new Error('HTTP '+r.status);continue}
      throw new Error('HTTP '+r.status);
    }catch(e){
      if(e.message=='stop')throw e;
      lastErr=e;await sleep(3000*(a+1));
    }
  }
  throw lastErr||new Error('Grok échec');
}
function grokHeaders(){return {'Content-Type':'application/json','Authorization':'Bearer '+KEYS.grok}}

function J(t){
  if(!t)return null;
  let c=String(t).replace(/```json|```/g,'').trim();
  const a=c.indexOf('{'),b=c.lastIndexOf('}');
  if(a<0||b<0)return null;
  c=c.slice(a,b+1);
  try{return JSON.parse(c)}catch(e){}
  let o='',s=false,x=false;
  for(let i=0;i<c.length;i++){
    const ch=c[i];
    if(x){o+=ch;x=false;continue}
    if(ch=='\\'){o+=ch;x=true;continue}
    if(ch=='"'){s=!s;o+=ch;continue}
    if(s&&ch=='\n'){o+='\\n';continue}
    if(s&&ch=='\r'){continue}
    if(s&&ch.charCodeAt(0)<32){o+=' ';continue}
    o+=ch;
  }
  try{return JSON.parse(o.replace(/,\s*([}\]])/g,'$1'))}catch(e){return null}
}

async function chat(sys,user,max,temp){
  const r=await grokFetch(GROK_API+'/chat/completions',{method:'POST',headers:grokHeaders(),body:JSON.stringify({model:GROK_TXT,messages:[{role:'system',content:sys},{role:'user',content:user}],temperature:temp,max_tokens:max})});
  const d=await r.json();
  const t=d.choices?.[0]?.message?.content;
  if(!t)throw new Error('Réponse vide');
  return t;
}
async function llmJSON(sys,user,max,temp){
  for(let a=0;a<3;a++){
    const raw=await chat(sys+' Réponds UNIQUEMENT par un objet JSON valide.',user,max,temp);
    const j=J(raw);
    if(j)return j;
    if(a<2)await sleep(1000);
  }
  throw new Error('JSON illisible');
}

/* IMAGES */
function readFile(f,maxSide){
  return new Promise(res=>{
    if(!f){console.warn('readFile: fichier null');return res(null)}
    const fr=new FileReader();
    fr.onerror=()=>{console.error('readFile: FileReader error');res(null)};
    fr.onload=()=>{
      const im=new Image();
      im.onerror=()=>{console.error('readFile: Image decode error');res(null)};
      im.onload=()=>{
        try{
          const s=Math.min(1,maxSide/Math.max(im.width,im.height));
          const c=document.createElement('canvas');
          c.width=Math.round(im.width*s)||1;
          c.height=Math.round(im.height*s)||1;
          c.getContext('2d').drawImage(im,0,0,c.width,c.height);
          const dataUrl=c.toDataURL('image/jpeg',0.88);
          res({u:dataUrl,d:dataUrl,w:im.width,h:im.height});
        }catch(e){console.error('readFile: canvas error',e);res(null)}
      };
      im.src=fr.result;
    };
    fr.readAsDataURL(f);
  });
}

function find(id){
  if(id=='P')return{t:'p',o:P};
  for(let i=0;i<P.chars.length;i++)if(P.chars[i].id==id)return{t:'c',o:P.chars[i]};
  for(let i=0;i<P.scenes.length;i++){
    const s=P.scenes[i];
    if(s.id==id)return{t:'s',o:s};
    const sh=s.shots||[];
    for(let j=0;j<sh.length;j++){
      const h=sh[j];
      if(h.id==id)return{t:'h',o:h,s:s};
      const subs=h.subshots||[];
      for(let k=0;k<subs.length;k++){
        if(subs[k].id==id)return{t:'sub',o:subs[k],h:h};
      }
    }
  }
  return null;
}

/* RSS */
function parseRSSXML(xml){
  const parser=new DOMParser();
  const doc=parser.parseFromString(xml,'text/xml');
  const items=doc.querySelectorAll('item');
  const articles=[];
  items.forEach((item,i)=>{
    if(i>=15)return;
    const title=item.querySelector('title')?.textContent||'';
    if(title&&title.length>10)articles.push({title:title.trim(),link:item.querySelector('link')?.textContent||'',pubDate:item.querySelector('pubDate')?.textContent||'',source:'RSS'});
  });
  return articles;
}

async function fetchOneRSS(rssUrl){
  try{
    const res=await fetch('https://api.rss2json.com/v1/api.json?rss_url='+encodeURIComponent(rssUrl),{signal:AbortSignal.timeout(15000)});
    const data=await res.json();
    if(data.status==='ok'&&data.items&&data.items.length>0){
      const articles=data.items.map(item=>({title:item.title||'',link:item.link||'',pubDate:item.pubDate||'',source:item.author||'RSS'})).filter(a=>a.title&&a.title.length>10);
      if(articles.length>0)return articles;
    }
  }catch(e){}
  try{
    const res=await fetch('https://api.allorigins.win/raw?url='+encodeURIComponent(rssUrl),{signal:AbortSignal.timeout(15000)});
    const articles=parseRSSXML(await res.text());
    if(articles.length>0)return articles;
  }catch(e){}
  throw new Error('Échec');
}

async function fetchRSSArticles(category){
  const source=RSS_SOURCES[category];
  if(!source)throw new Error('Source inconnue');
  let allArticles=[];
  for(const url of source.urls){
    try{const articles=await fetchOneRSS(url);allArticles=allArticles.concat(articles);if(allArticles.length>=10)break}catch(e){}
  }
  if(allArticles.length===0)throw new Error('Aucun article.');
  const seen=new Set();const unique=[];
  for(const a of allArticles){if(!seen.has(a.title)){seen.add(a.title);unique.push(a)}}
  return unique.slice(0,20);
}

async function analyzeArticles(articles){
  if(!articles.length)throw new Error('Aucun article');
  const prompt=P.reconstitution_analyze_prompt+'\n\nARTICLES :\n'+articles.map((a,i)=>`${i+1}. ${a.title}`).join('\n')+
    '\n\nJSON : {"articles":[{"title":"...","score_drole":0-10,"score_emouvant":0-10,"score_action":0-10,"score_original":0-10,"score_viral":0-10,"pourquoi":"...","categorie":"emouvant|action|comique"}]}\nSélectionne 3-4 meilleurs.';
  const j=await llmJSON('Scénariste viral.',prompt,3000,0.7);
  if(!j.articles||!j.articles.length)throw new Error('Aucun article');
  return j.articles.slice(0,4);
}

/* HELPERS PROMPTS IMAGES */
function buildCharacterPrompt(c){
  if(P.fidele&&c.name&&P.fidele.chars[fidKey(c.name)])return P.fidele.styleBlock+', character reference sheet, '+c.name+': '+P.fidele.chars[fidKey(c.name)]+', full body, neutral standing pose, plain neutral background, front view';
  const parts=[];
  parts.push('portrait of '+(c.name||'character'));
  if(c.desc)parts.push(c.desc);
  if(c.outfit)parts.push('wearing '+c.outfit);
  parts.push(st());
  parts.push('neutral expression, cinematic lighting, full body, consistent character design');
  return parts.filter(Boolean).join(', ');
}

function buildScenePrompt(s){
  const parts=[];
  parts.push('wide shot of '+(s.decor||'scene'));
  if(s.summary)parts.push(s.summary);
  if(s.mood)parts.push(s.mood+' mood');
  parts.push(st());
  parts.push('cinematic lighting, establishing shot, no characters');
  return parts.filter(Boolean).join(', ');
}

function buildShotImagePrompt(h,s){
  if(h.fid&&P.fidele)return buildShotImagePromptFidele(h);
  const parts=[];
  parts.push(h.size||'medium shot');
  if(s.decor)parts.push('of '+s.decor);
  if(h.action)parts.push(h.action);
  if(h.chars&&h.chars.length)parts.push('featuring '+h.chars.join(', '));
  parts.push(st());
  parts.push('cinematic lighting');
  return parts.filter(Boolean).join(', ');
}

/* RÉGÉNÉRER DIALOGUES */
async function regenDialogueForShot(shotId){
  const f=find(shotId);if(!f||f.t!=='h')return toast('Plan introuvable');
  const h=f.o,s=f.s;
  if(h.fid)return regenDialogueFid(h);
  if(!s.dialogue||!s.dialogue.length)return toast('Scène sans dialogue');
  const used=[];
  (s.shots||[]).forEach(x=>{if(x.id!==h.id)(x.dialogue||[]).forEach(d=>{if(d.line)used.push(d.line.trim())})});
  const avail=s.dialogue.filter(d=>d.line&&used.indexOf(d.line.trim())<0);
  if(!avail.length)return toast('Tous les dialogues utilisés');
  toast('Grok choisit…');
  try{
    const j=await llmJSON('Tu es réalisateur. Choisis les dialogues adaptés à ce plan. Maximum 8 mots par réplique.',
      'Plan : '+h.action+'\nCaméra : '+h.camera+'\nDurée : '+h.duration+'s\n\nDialogues disponibles :\n'+JSON.stringify(avail,null,2)+
      '\n\nJSON : {"dialogue":[{"who":"","line":"","mode":"normal"}]}',
      1500,0.5);
    const chosen=Array.isArray(j.dialogue)?j.dialogue:[];
    h.dialogue=chosen.map(d=>({who:String(d.who||''),line:String(d.line||''),mode:DIALOGUE_MODES.indexOf(d.mode)>=0?d.mode:'normal',type:'synchrone',obligatoire:true}));
    if(h.dialogue.length){h.son='';toast('✓ '+h.dialogue.length+' dialogue(s)')}
    else{if(!h.son)h.son='ambiance';toast('Aucun dialogue, son ajouté')}
    render(true);save();
  }catch(e){toast('Erreur : '+e.message)}
}

/* LECTEUR */
async function play(){
  const a=shots().filter(x=>x.h.video||x.h.img||(x.h.split==='vertical'&&x.h.subshots&&x.h.subshots.some(s=>s.video||s.img)));
  if(!a.length)return toast('Rien à lire');
  playing=true;$('#pl').classList.add('on');
  const v=$('#pv'),im=$('#pi'),sw=$('#split-wrap');
  const vw=$('#pv-wrap'),iw=$('#pi-wrap');
  for(let i=0;i<a.length;i++){
    if(!playing)break;
    const h=a[i].h;
    const lineText=h.dialogue&&h.dialogue.length?h.dialogue.map(d=>d.who+' : '+d.line).join(' | '):'';
    $('#sub').textContent=lineText;
    if(h.split==='vertical'&&h.subshots&&h.subshots.length>=2){
      vw.style.display='none';iw.style.display='none';sw.style.display='flex';
      const sL=h.subshots[0],sR=h.subshots[1];
      if(sL.video)$('#pvl').src=sL.video;
      if(sR.video)$('#pvr').src=sR.video;
      await new Promise(r=>{let c=0;const done=()=>{c++;if(c>=2)r()};if(sL.video){$('#pvl').onended=done;$('#pvl').play().catch(done)}else setTimeout(done,3000);if(sR.video){$('#pvr').onended=done;$('#pvr').play().catch(done)}else setTimeout(done,3000)});
      h.seen=true;
    } else if(h.video){
      sw.style.display='none';iw.style.display='none';vw.style.display='block';
      v.src=h.video;
      await new Promise(r=>{v.onended=r;v.onerror=r;v.play().catch(r)});
      h.seen=true;
    } else {
      sw.style.display='none';vw.style.display='none';iw.style.display='block';
      im.src=ref(h.img);
      if(h.dialogue&&h.dialogue.length&&'speechSynthesis' in window){speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(h.dialogue.map(d=>d.line).join(' '));u.lang='fr-FR';speechSynthesis.speak(u)}
      await sleep(Math.max(2500,(lineText||'').length*75));
    }
  }
  stopPlay();save();
}
function stopPlay(){playing=false;$('#pv').pause();if($('#pvl'))$('#pvl').pause();if($('#pvr'))$('#pvr').pause();if('speechSynthesis' in window)speechSynthesis.cancel();$('#pl').classList.remove('on');if(!TASK)render(true)}

/* MARKDOWN EXPORT */
function generateMarkdown(){
  const lines=[];
  lines.push('# '+(P.title||'Mon Film')+' — Prompts Images');
  lines.push('');
  lines.push('Durée totale : '+fmtDur(shots().reduce((s,x)=>s+(x.h.duration||GROK_DEFAULT_DURATION),0))+' · Format : '+P.ratio);
  lines.push('');
  lines.push('**Bloc de style** : '+st());
  lines.push('');
  lines.push('**Bloc animation** : smooth natural motion, subtle facial acting, no morphing, consistent character, no text, no watermark');
  lines.push('');

  if(P.chars.length){
    lines.push('## Personnages');
    lines.push('');
    P.chars.forEach(c=>{
      lines.push('### '+(c.name||'?').toUpperCase());
      if(c.desc)lines.push('- Description : '+c.desc);
      if(c.outfit)lines.push('- Costume : '+c.outfit);
      lines.push('- Prompt : '+buildCharacterPrompt(c));
      lines.push('');
    });
  }

  if(P.scenes.length){
    P.scenes.forEach((s,i)=>{
      lines.push('## Scène '+(i+1)+' — '+esc(s.title||''));
      if(s.decor)lines.push('- Décor : '+s.decor);
      if(s.summary)lines.push('- Résumé : '+s.summary);
      lines.push('- Prompt : '+buildScenePrompt(s));
      lines.push('');
    });
  }

  lines.push('## Plans');
  lines.push('');
  const actes={};
  P.scenes.forEach(s=>{if(!actes[s.acte])actes[s.acte]={titre:s.titre_acte||('Acte '+s.acte),scenes:[]};actes[s.acte].scenes.push(s)});
  Object.keys(actes).sort((a,b)=>a-b).forEach(num=>{
    const a=actes[num];
    lines.push('### Acte '+num+' — '+a.titre);
    lines.push('');
    let tc=0;
    a.scenes.forEach(s=>{
      (s.shots||[]).forEach(h=>{
        const numPlan=h.num||(tc+1);
        lines.push('#### Plan '+numPlan+' ('+h.duration+'s)');
        lines.push('');
        lines.push('- Image : '+buildShotImagePrompt(h,s));
        lines.push('- Animation : '+(h.camera||'medium shot'));
        if(h.zoom_type&&h.zoom_type!=='aucun'){
          lines.push('- Zoom : '+h.zoom_type+' sur '+h.zoom_cible+' ('+h.zoom_vitesse+', '+h.zoom_moment+')');
        }
        if(h.dialogue&&h.dialogue.length)lines.push('- Dialogue : '+h.dialogue.map(d=>d.who+' : « '+d.line+' »').join(' | '));
        else if(h.son)lines.push('- Son : '+h.son);
        else lines.push('- Dialogue : (aucun)');
        if(h.notes_realisateur)lines.push('- Notes : '+h.notes_realisateur);
        lines.push('- Prompt : '+buildVideoPrompt(h,s));
        lines.push('');
        tc+=h.duration||GROK_DEFAULT_DURATION;
      });
    });
  });

  lines.push('## Conseils de cohérence');
  lines.push('');
  lines.push('- Garde les mêmes images de référence pour chaque personnage.');
  lines.push('- Fixe le seed (ou la même image de départ) pour les plans d\'un même lieu.');
  lines.push('- Génère 2 à 3 versions de chaque plan vidéo et garde la meilleure.');
  return lines.join('\n');
}

function generateImagePromptsOnly(){
  const lines=[];
  lines.push('# Prompts Images — '+(P.title||'Film'));
  lines.push('');
  lines.push('**Style** : '+st());
  lines.push('');
  P.chars.forEach(c=>{
    lines.push('## '+(c.name||'?').toUpperCase());
    lines.push(buildCharacterPrompt(c));
    lines.push('');
  });
  P.scenes.forEach((s,i)=>{
    lines.push('## Scène '+(i+1)+' — '+esc(s.title||''));
    lines.push(buildScenePrompt(s));
    lines.push('');
    (s.shots||[]).forEach(h=>{
      lines.push('### Plan '+(h.num||'')+' ('+h.duration+'s)');
      lines.push(buildShotImagePrompt(h,s));
      lines.push('');
    });
  });
  return lines.join('\n');
}

function copyMarkdown(){navigator.clipboard.writeText(generateMarkdown()).then(()=>toast('✓ Markdown copié')).catch(()=>toast('Copie impossible'))}
function downloadMarkdown(){const u=URL.createObjectURL(new Blob([generateMarkdown()],{type:'text/markdown'}));const l=document.createElement('a');l.href=u;l.download=sanitizeName(P.title||'film')+'-plan.md';l.click();URL.revokeObjectURL(u);toast('✓ Markdown téléchargé')}
function copyImagePrompts(){navigator.clipboard.writeText(generateImagePromptsOnly()).then(()=>toast('✓ Prompts images copiés')).catch(()=>toast('Copie impossible'))}

async function exportZip(){
  if(!window.JSZip){toast('JSZip non chargé');return}
  const zip=new JSZip();
  zip.file('plan-de-tournage.md',generateMarkdown());
  zip.file('prompts-images.md',generateImagePromptsOnly());
  zip.file('projet.json',JSON.stringify(P,null,2));
  const imgs=zip.folder('images');
  P.chars.forEach(c=>{if(c.img&&c.img.d){const b64=c.img.d.split(',')[1];if(b64)imgs.file('personnages/'+sanitizeName(c.name)+'.jpg',b64,{base64:true})}});
  const blob=await zip.generateAsync({type:'blob'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');a.href=url;a.download=sanitizeName(P.title||'film')+'.zip';a.click();
  URL.revokeObjectURL(url);toast('✓ ZIP exporté');
}
function sanitizeName(s){return String(s||'sans-titre').replace(/[^a-zA-Z0-9_-]+/g,'-').toLowerCase()||'sans-titre'}

/* ═══════════════════════════════════════════════════════════════
   ASSEMBLAGE CÔTÉ CLIENT — ffmpeg.wasm (SANS SOUS-TITRES)
   Compatible mobile : détecte SharedArrayBuffer, bascule en mono-thread
   ═══════════════════════════════════════════════════════════════ */
let FFMPEG=null;
const HAS_SAB=(typeof SharedArrayBuffer!=='undefined');

async function getFFmpeg(){
  if(FFMPEG)return FFMPEG;
  const {FFmpeg}=window.FFmpegWASM;
  const {toBlobURL}=window.FFmpegUtil;
  const ff=new FFmpeg();
  const base='https://unpkg.com/@ffmpeg/core@0.12.6/dist/umd';
  await ff.load({
    coreURL:await toBlobURL(base+'/ffmpeg-core.js','text/javascript'),
    wasmURL:await toBlobURL(base+'/ffmpeg-core.wasm','application/wasm'),
  });
  FFMPEG=ff;
  return ff;
}

function setAssembleStatus(html){
  const z=document.getElementById('assemble-status');
  if(z)z.innerHTML=html;
}

async function assembleFilm(){
  const a=shots().filter(x=>x.h.video);
  if(!a.length)return toast('Aucune vidéo générée — lancez la production d\'abord');
  if(a.length!==shots().length){
    const missing=shots().length-a.length;
    if(!confirm(missing+' plan(s) sans vidéo. Assembler quand même les '+a.length+' plans disponibles ?'))return;
  }

  if(!HAS_SAB){
    toast('Mode mono-thread (plus lent sur mobile)');
  }
  if(a.length>6){
    if(!confirm('Vous avez '+a.length+' plans. Sur mobile, l\'assemblage peut manquer de mémoire. Continuer ?'))return;
  }

  const btn=document.getElementById('assemble-btn');
  if(btn)btn.disabled=true;
  setAssembleStatus('<div class="guide wt"><i class="sp2"></i> Chargement de ffmpeg.wasm (première fois : ~30 s)…'+(HAS_SAB?'':' mode mono-thread')+'</div>');

  try{
    const ff=await getFFmpeg();

    ff.on('log',({message})=>{
      if(message&&message.length<120)setAssembleStatus('<div class="guide wt"><i class="sp2"></i> ffmpeg : '+esc(message)+'</div>');
    });

    setAssembleStatus('<div class="guide wt"><i class="sp2"></i> Téléchargement des vidéos…</div>');
    const names=[];
    for(let i=0;i<a.length;i++){
      setAssembleStatus('<div class="guide wt"><i class="sp2"></i> Vidéo '+(i+1)+'/'+a.length+'…</div>');
      const r=await fetch(a[i].h.video);
      if(!r.ok)throw new Error('téléchargement plan '+(i+1)+' échoué ('+r.status+')');
      const buf=new Uint8Array(await r.arrayBuffer());
      const name='shot_'+String(i).padStart(3,'0')+'.mp4';
      await ff.writeFile(name,buf);
      names.push(name);
    }

    setAssembleStatus('<div class="guide wt"><i class="sp2"></i> Préparation de la concaténation…</div>');
    await ff.writeFile('concat.txt',new TextEncoder().encode(names.map(n=>"file '"+n+"'").join('\n')));

    setAssembleStatus('<div class="guide wt"><i class="sp2"></i> Assemblage (peut prendre 60-180 s sur mobile)…</div>');
    setAssembleStatus('<div class="guide wt"><i class="sp2"></i> Assemblage rapide (sans ré-encodage)…</div>');
    let code=1,okOut=false;
    try{code=await ff.exec(['-f','concat','-safe','0','-i','concat.txt','-c','copy','-movflags','+faststart','final.mp4'])}catch(e){}
    try{const t=await ff.readFile('final.mp4');okOut=(code===0&&t&&t.length>1000)}catch(e){}
    if(!okOut){
      setAssembleStatus('<div class="guide wt"><i class="sp2"></i> Ré-encodage (plus long, patientez)…</div>');
      await ff.exec([
      '-f','concat','-safe','0','-i','concat.txt',
      '-c:v','libx264','-preset','ultrafast','-crf','26',
      '-c:a','aac','-b:a','128k','-movflags','+faststart',
      'final.mp4'
    ]);
    }

    const data=await ff.readFile('final.mp4');
    const blob=new Blob([data.buffer],{type:'video/mp4'});
    const url=URL.createObjectURL(blob);

    const zone=document.getElementById('final-video-zone');
    if(zone){
      zone.innerHTML='<div class="final-video"><div class="lab" style="color:#fff;margin-bottom:6px">FILM FINAL</div>'+
        '<video src="'+url+'" controls playsinline></video>'+
        '<div class="rw" style="margin-top:8px;justify-content:center">'+
          '<a class="btn big" href="'+url+'" download="'+sanitizeName(P.title||'film')+'.mp4">⬇ Télécharger le MP4</a>'+
        '</div></div>';
    }
    setAssembleStatus('<div class="guide go">✓ Film assemblé ('+a.length+' plans, '+Math.round(blob.size/1024/1024*10)/10+' Mo)</div>');
    toast('🎞 Film assemblé');

    try{
      for(const n of names)await ff.deleteFile(n);
      await ff.deleteFile('concat.txt');
      await ff.deleteFile('final.mp4');
    }catch(e){}
  }catch(e){
    console.error(e);
    setAssembleStatus('<div class="guide er"><b>Erreur :</b> '+esc(e.message)+'<br><br>'+
      'Astuce mobile : essayez avec moins de plans, en 480p, ou téléchargez les plans séparément.'+
      '<div class="rw" style="margin-top:8px">'+
        '<button data-a="fallback-plans">⬇ Télécharger les plans séparément</button>'+
      '</div></div>');
    toast('Erreur assemblage : '+e.message);
  }finally{
    if(btn)btn.disabled=false;
  }
}

const pad2=n=>String(n).padStart(2,'0');
function planList(){const all=shots();return all.map((x,i)=>({n:i+1,total:all.length,url:x.h.video||'',dur:x.h.duration,label:x.h.label||'',name:sanitizeName(P.title||'film')+'_'+pad2(i+1)+(x.h.label?'_plan'+x.h.label:'')+'_sur_'+pad2(all.length)+'.mp4'}))}
function saveBlob(blob,name){const u=URL.createObjectURL(blob);const l=document.createElement('a');l.href=u;l.download=name;document.body.appendChild(l);l.click();l.remove();setTimeout(()=>URL.revokeObjectURL(u),30000)}
async function dlOne(n){
  const p=planList()[n-1];if(!p||!p.url)return toast('Plan '+n+' : pas de vidéo');
  toast('⏳ Plan '+pad2(n)+'…');
  try{const r=await fetch(p.url);if(!r.ok)throw new Error('HTTP '+r.status);saveBlob(await r.blob(),p.name);toast('✓ '+p.name)}
  catch(e){log('wn','Téléchargement direct impossible plan '+n+' ('+e.message+')');window.open(p.url,'_blank');toast('Plan '+pad2(n)+' : appuyez sur « ↗ Ouvrir » puis appui long sur la vidéo → Télécharger')}
}
async function zipPlans(){
  if(!window.JSZip)return toast('JSZip non chargé');
  const list=planList().filter(p=>p.url);if(!list.length)return toast('Aucune vidéo');
  const say=h=>{const z=document.getElementById('dl-status');if(z)z.innerHTML=h};
  const zip=new JSZip(),failed=[];
  for(const p of list){
    say('<div class="guide wt"><i class="sp2"></i> Plan '+pad2(p.n)+' / '+pad2(p.total)+'…</div>');
    try{const r=await fetch(p.url);if(!r.ok)throw new Error('HTTP '+r.status);zip.file(p.name,await r.arrayBuffer())}catch(e){failed.push(p.n)}
  }
  if(failed.length===list.length){say('<div class="guide er"><b>Le navigateur bloque le téléchargement groupé</b> (les vidéos sont hébergées sur un autre site). Utilisez les boutons « ↗ Ouvrir » ci-dessous : appui long sur la vidéo → Télécharger.</div>');return}
  say('<div class="guide wt"><i class="sp2"></i> Création du ZIP…</div>');
  const blob=await zip.generateAsync({type:'blob',compression:'STORE'});
  saveBlob(blob,sanitizeName(P.title||'film')+'_plans.zip');
  say('<div class="guide go">✓ ZIP prêt ('+(list.length-failed.length)+' plans)'+(failed.length?' · échec plans : '+failed.join(', '):'')+'</div>');
}

function view(){
  if(TASK)return workView();
  const step=currentStep();
  if(!step)return '<div class="hero"><h2>Erreur</h2></div>';
  const fn=V[step.id];
  if(!fn)return '<div class="hero"><h2>Étape inconnue : '+step.id+'</h2></div>';

function render(keep){
  const mode=currentMode();
  $('#steps').innerHTML=mode.steps.map((s,i)=>{
    const can=!TASK&&i!=P.step_idx&&(i==0||(keysReady()&&i<=P.step_idx));
    return '<button class="st '+(i==P.step_idx?'on':can?'ok':'')+'" '+(can?'data-a="goto" data-n="'+i+'"':'disabled')+'>'+(i+1)+'. '+s.label+'</button>';
  }).join('');
  $('#main').innerHTML=view();
  if(TASK)paintFeed();
  if(!keep)scrollTo(0,0);
  save();
}

function buildTonChuteContext(){
  let ctx='';
  if(P.ton==='sobre')ctx+='\n═══ TON : SOBRE ═══\n- Personnages SOBRES : pas de grimaces.\n- Humour par la SITUATION.\n';
  else if(P.ton==='cartoonesque')ctx+='\n═══ TON : CARTOONESQUE ═══\n- Expressions exagérées AUTORISÉES.\n';
  if(P.chute==='comique')ctx+='\n═══ CHUTE : COMÉDIQUE ═══\n- Le DERNIER plan DOIT contenir une chute comique.\n';
  else if(P.chute==='plot_twist')ctx+='\n═══ CHUTE : PLOT TWIST ═══\n- Le DERNIER plan DOIT contenir un retournement.\n';
  return ctx;
}

/* GRAMMAIRE CINÉMA + ÉMOTION + CAUSALITÉ */
const CINEMA_GRAMMAR = `
════════════════════════════════════════
GRAMMAIRE CINÉMATOGRAPHIQUE (OBLIGATOIRE)
════════════════════════════════════════

Pour CHAQUE scène, tu DOIS préciser :
- **size** : wide shot | medium shot | close-up | extreme close-up | two-shot | over-the-shoulder
- **camera** : static | handheld | slow push-in | tracking shot | low-angle | high-angle | eye-level
- **zoom_type** : avant | arriere | aucun
- **zoom_cible** : visage | yeux | mains | objet | paysage | aucune
- **zoom_vitesse** : lent | moyen | rapide
- **zoom_moment** : debut | milieu | fin
- **duration** : entre 4 et 10 secondes (privilégier 5-6s)
- **causal_link** : la conséquence directe de cette scène sur la suivante (ex: "il a des griffures → il rate le train"). Si c'est la dernière scène, mettre "chute".

════════════════════════════════════════
⭐ RÈGLE DE COHÉRENCE NARRATIVE (CAUSALITÉ)
════════════════════════════════════════

Chaque scène est la CONSÉQUENCE DIRECTE de la précédente.
Test : si tu supprimes une scène, le spectateur ne comprend plus.
Si tu sautes une scène, l'histoire devient incompréhensible.

Exemple de chaîne causale correcte :
Scène 1 : Marc court en retard → Scène 2 : il voit un chat, monte, se fait griffer (conséquence : il est blessé) → Scène 3 : à cause des griffures, il rate son train, décide de dormir sur place (conséquence : il est là la veille) → Scène 4 : Sophie le découvre endormi (conséquence : elle se souvient du chat) → Scène 5 : il est embauché, regarde sa montre (chute).

Chaque scène doit contenir un ÉLÉMENT DÉCLENCHEUR visible :
- Un objet (la montre, une griffure, un chat)
- Un geste (monter à l'arbre, tendre la main)
- Une révélation (Sophie a vu les caméras)
- Un dialogue qui change la situation

INTERDIT : scènes déconnectées, sauts temporels non expliqués, ellipses incompréhensibles.

════════════════════════════════════════
⭐ RÈGLE ABSOLUE — ÉMOTION AU PLAN 2
════════════════════════════════════════

La SCÈNE 2 (dans l'acte 1) de chaque variante DOIT poser l'émotion principale du film :
- Si drame → scène 2 montre la tristesse/injustice (close-up visage, larme, silence, zoom avant lent sur visage)
- Si comédie → scène 2 montre le problème/décalage (visage déconfit, situation absurde, zoom avant sur yeux)
- Si action → scène 2 montre la tension/enjeu (regard intense, menace, urgence, zoom rapide sur yeux)
- Si romance → scène 2 montre la rencontre/attirance (premier regard, hésitation, zoom lent sur visage)

STRUCTURE NARRATIVE IMPOSÉE :
- Scène 1 (Acte 1) = CONTEXTE (où, qui, situation normale) → wide/medium shot
- Scène 2 (Acte 1) = ÉMOTION ⭐ (zoom avant sur visage ou yeux OBLIGATOIRE)
- Scène 3+ = DÉVELOPPEMENT (conséquences, tentatives, résolution)

════════════════════════════════════════
RÈGLES DE GRAMMAIRE (zooms)
════════════════════════════════════════

1. **Varie les plans** : wide → medium → close-up.
2. **Zoom avant sur VISAGE** = émotion forte, révélation. Zoom lent.
3. **Zoom avant sur YEUX** = intensité, suspense. Zoom rapide.
4. **Zoom avant sur MAINS** = geste symbolique.
5. **Zoom avant sur OBJET** = indice, révélation.
6. **Zoom arrière sur PAYSAGE** = isolement, contexte.
7. **Slow push-in** = montée de tension.
8. **Static + low-angle** = puissance, calme.
9. **Tracking shot** = urgence, fuite.
10. **Handheld** = chaos, spontanéité.

RÈGLE : Chaque dialogue important DOIT être accompagné d'un ZOOM SUR LE VISAGE pour capter l'expression.
`;

async function generateVariants(article){
  const libContext=await buildLibraryContext();
  const tonChute=buildTonChuteContext();

  const angles=[
    {label:'Comédie sociale',hint:'Humour par la situation, personnages crédibles, chute ironique'},
    {label:'Comédie absurde',hint:'Situation qui dérape, personnages dépassés, chute inattendue'},
    {label:'Drame touchant',hint:'Émotion sincère, personnages attachants, chute douce-amère'},
    {label:'Thriller léger',hint:'Suspense léger, malentendus, chute twist'}
  ];

  const exemple = `EXEMPLE COMPLET (article : "un homme rate tous ses rendez-vous à cause d'un chat") :

⚠️ RÈGLE D'OR : chaque scène est la CONSÉQUENCE DIRECTE de la précédente. Test : "et donc ?" doit trouver une réponse évidente.

/* VIDÉOS */
async function launch(h,s){
  if(!KEYS.grok||!KEYS.useGrok){h.vst='er';h.err='Grok désactivé ou clé absente';return}
  if(!h.img&&!h.fid){h.vst='er';h.err='Image manquante';return}
  const frUri=ref(h.img);
  h.vst='run';h.err='';
  const duration=h.duration||GROK_DEFAULT_DURATION;
  const prompt=buildVideoPrompt(h,s);
  const body={model:GROK_VID,prompt:prompt,duration:duration,resolution:P.resolution||'480p',aspect_ratio:P.ratio};if(frUri)body.image={url:frUri};
  let r;
  try{r=await grokFetch(GROK_API+'/videos/generations',{method:'POST',headers:grokHeaders(),body:JSON.stringify(body)})}
  catch(e){h.vst='er';h.err=e.message;return}
  const d=await r.json();
  const requestId=d.request_id||d.id;
  if(!requestId){h.vst='er';h.err='pas de request_id';return}
  h.task={id:requestId,k:KEYS.grok};Q.on=true;save();poll(h);
}

async function poll(h){
  const t=h.task,end=Date.now()+30*60000;let n=0;
  try{
    await sleep(20000);
    while(Date.now()<end&&P){
      const url=GROK_API+'/videos/'+encodeURIComponent(t.id);
      let d=null;
      try{const r=await fetch(url,{headers:{Authorization:'Bearer '+t.k}});if(r.status===429){await sleep(8000);continue}if(!r.ok){await sleep(6000);n++;continue}d=await r.json()}catch(e){n++;await sleep(6000);continue}
      if(d){
        const s=String(d.status||'').toLowerCase();
        if(s==='done'||s==='completed'||s==='succeeded'){
          const u=d.video?.url||d.url||d.output?.url;
          if(!u)throw new Error('sans URL');
          h.video=u;h.vst='ok';h.err='';
          if(!h.videoHistory)h.videoHistory=[];
          h.videoHistory.unshift({url:u,duration:h.duration,resolution:P.resolution,date:Date.now()});
          if(h.videoHistory.length>5)h.videoHistory=h.videoHistory.slice(0,5);
          toast('🎬 Vidéo '+h.duration+'s');save();return;
        }
        if(s==='failed'||s==='error')throw new Error(String(d.error?.message||'échec').slice(0,100));
      }
      const iv=Math.min(15000,5000+n*1000);n++;await sleep(iv);
    }
    throw new Error('délai dépassé');
  }catch(e){h.vst='er';h.err=e.message;save()}
}

/* DÉTECTION BINAIRE + EXTRACTION .DOCX */
function isBinaryContent(text){
  if(!text)return false;
  if(text.startsWith('PK\u0003\u0004'))return true;
  let nonPrintable=0;
  const sample=text.slice(0,3000);
  for(let i=0;i<sample.length;i++){
    const c=sample.charCodeAt(i);
    if(c<9 || (c>13 && c<32))nonPrintable++;
  }
  return nonPrintable>sample.length*0.05;
}

async function extractDocxText(fileOrBlob){
  if(!window.JSZip)throw new Error('JSZip requis pour lire les .docx');
  const zip=await JSZip.loadAsync(fileOrBlob);
  const docFile=zip.file('word/document.xml');
  if(!docFile)throw new Error('Ce ZIP ne contient pas word/document.xml.');
  const xml=await docFile.async('string');
  let text='';
  const paragraphs=xml.split(/<\/w:p>/);
  paragraphs.forEach(p=>{
    const matches=p.match(/<w:t[^>]*>([\s\S]*?)<\/w:t>/g)||[];
    const line=matches.map(m=>m.replace(/<[^>]+>/g,'').replace(/&lt;/g,'<').replace(/&gt;/g,'>').replace(/&amp;/g,'&').replace(/&quot;/g,'"').replace(/&apos;/g,"'")).join('');
    if(line.trim())text+=line+'\n';
  });
  return text;
}

async function readAnyFile(file){
  const buffer=await file.arrayBuffer();
  const firstBytes=new Uint8Array(buffer.slice(0,4));
  const isZip=firstBytes[0]===0x50 && firstBytes[1]===0x4B;
  const isOle=firstBytes[0]===0xD0 && firstBytes[1]===0xCF;
  if(isOle)throw new Error('Fichier .doc (Word 97-2003). Enregistrez sous .docx ou .txt.');
  if(isZip){
    const blob=new Blob([buffer],{type:file.type||'application/zip'});
    const text=await extractDocxText(blob);
    if(!text.trim())throw new Error('Le .docx ne contient pas de texte lisible.');
    return {text,kind:'docx'};
  }
  const text=new TextDecoder('utf-8').decode(buffer);
  if(isBinaryContent(text))throw new Error('Fichier binaire illisible.');
  return {text,kind:'text'};
}

async function regenImage(id,prov){
  const f=find(id);if(!f)return;
  let o=f.o,prompt,sc=null;
  if(f.t==='s'){
    const sh=(o.shots||[]);
    if(sh.length===1&&sh[0].fid){sc=o;o=sh[0];prompt=buildShotImagePromptFidele(o)}
    else prompt=buildScenePrompt(o);
  }else if(f.t==='h')prompt=o.fid?buildShotImagePromptFidele(o):buildShotImagePrompt(o,f.s);
  else if(f.t==='c')prompt=buildCharacterPrompt(o);
  else return toast('Régénération impossible ici');
  const pv=prov||provPref(),provs=pv==='both'?['agnes','grok']:[pv];
  if(!imgReady(provs))return;
  GEN_IMG_BUSY=true;o.busy=true;render(true);toast('🔄 Nouvelle image…');
  try{
    const res=await Promise.allSettled(provs.map(p=>genImg(p,prompt)));
    let got=false;
    res.forEach((r,k)=>{
      const p=provs[k];
      if(r.status==='fulfilled'){
        o.imgAlt=o.imgAlt||{};
        if(!got){pushImgHist(o);o.img=r.value;o.imgSrc=p;got=true}
        o.imgAlt[p]=r.value;
      }else log('er','Régénération ('+p+') : '+r.reason.message);
    });
    toast(got?'✓ Nouvelle image (l\'ancienne est dans « Versions »)':'❌ Échec : réessayez');
  }finally{o.busy=false;GEN_IMG_BUSY=false;save();render(true)}
}

function parsePlan(text){
  text=String(text||'')
    .replace(/\r\n/g,'\n').replace(/\r/g,'\n')
    .replace(/[‘’]/g,"'").replace(/[“”«»]/g,'"')
    .replace(/[–—]/g,'-').replace(/…/g,'...')
    .replace(/[\x00-\x08\x0B\x0C\x0E-\x1F\x7F-\x9F]/g,'')
    .replace(/^PK[\x00-\x08][\s\S]{0,5000}/,'');
  if(text.trim().length<20)throw new Error('Fichier vide ou binaire');
  if(/^\*\*Plan\s+\d+\s*-\s*\d+:\d{2}\s*-\s*\d+(?:[.,]\d+)?\s*s\*\*/m.test(text)&&/^[-*•]\s*\*Image\*/mi.test(text)){const fp=parsePlanFidele(text);if(fp.scenes.length)return fp}

  const result={title:'',scenes:[],chars:[],actes:[]};
  const lines=text.split('\n');

  const timecodeLines=lines.filter(l=>/^\s*0?:\d{2}\s*-\s*\d+:\d{2}\s*[:：]\s*.+/i.test(l.trim()));
  const hasMarkdownPlan=/^\*\*Plan\s+\d+/im.test(text);
  const hasActe=/^#{2,3}\s+Acte\s+\d+/im.test(text);
  if(timecodeLines.length>0 && !hasMarkdownPlan && !hasActe){
    return parseTimecodeFormat(text,timecodeLines,lines);
  }

  let section='',currentActe=null,currentScene=null,currentShot=null;

  for(let i=0;i<lines.length;i++){
    const trimmed=lines[i].trim();
    if(!trimmed)continue;

    if(trimmed.startsWith('# ')&&!result.title){
      result.title=trimmed.replace(/^#+\s*/,'').replace(/\s*--.*$/,'').trim();
      continue;
    }
    if(/fiches?\s*personnages?|personnages?\s*:/i.test(trimmed)&&!/dialogue/i.test(trimmed)){
      section='chars';continue;
    }
    if(section==='chars'){
      const charM=trimmed.match(/^[-*•]?\s*\*\*\\?\[([^\]]+)\\?\]\*\*\s*[:：]?\s*(.*)$/) ||
                  trimmed.match(/^[-*•]?\s*\*\*([A-ZÉÈÀÂÊÎÔÛÇ][A-ZÉÈÀÂÊÎÔÛÇ\s'-]+?)\*\*\s*[:：]\s*(.*)$/) ||
                  trimmed.match(/^[-*•]?\s*\\?\[([^\]]+)\\?\]\s*[:：]?\s*(.*)$/) ||
                  trimmed.match(/^[-*•]\s*([A-ZÉÈÀÂÊÎÔÛÇ][A-ZÉÈÀÂÊÎÔÛÇ\s'-]+?)\s*[:：]\s*(.*)$/);
      if(charM){result.chars.push({id:uid(),name:charM[1].trim(),desc:charM[2].trim(),outfit:'',role:'supporting'});continue}
    }
    const acteM=trimmed.match(/^#{2,3}\s+Acte\s+(\d+)\s*-?\s*[:：]?\s*(.*)$/i);
    if(acteM){currentActe={num:parseInt(acteM[1],10)||1,titre:acteM[2].trim()};result.actes.push(currentActe);continue}

    const planM=trimmed.match(/^\*\*Plan\s+(\d+)\s*-\s*(\d+:\d+)\s*-\s*(\d+)\s*s?\*\*/) ||
                trimmed.match(/^\*\*Plan\s+(\d+)\s*\((\d+:\d+)\s*-\s*(\d+:\d+)\)\*\*/) ||
                trimmed.match(/^Plan\s+(\d+)\s*-?\s*[:：]?\s*(\d+:\d+)\s*-?\s*[:：]?\s*(\d+)\s*s/i) ||
                trimmed.match(/^###\s+Plan\s+(\d+)/i);
    if(planM){
      let num=parseInt(planM[1],10),duration=6;
      if(planM[3]){
        if(planM[3].indexOf(':')>=0){
          const end=planM[3].split(':'),start=planM[2].split(':');
          duration=(parseInt(end[0])*60+parseInt(end[1]))-(parseInt(start[0])*60+parseInt(start[1]));
        } else duration=parseInt(planM[3],10)||6;
      }
      currentShot={id:uid(),num:num,duration:Math.max(GROK_MIN_DURATION,Math.min(GROK_MAX_DURATION,duration)),action:'',camera:'medium shot',dialogue:[],chars:[],son:'',img:null,busy:false,vst:'wait',zoom_type:'aucun',zoom_cible:'aucune',zoom_vitesse:'lent',zoom_moment:'milieu',notes_realisateur:'',videoHistory:[],split:'none',subshots:[]};

      let j=i+1;
      while(j<lines.length && !/^\*\*Plan\s+\d+/i.test(lines[j].trim()) && !/^###\s+Plan/i.test(lines[j].trim()) && !/^#{2,3}\s+Acte/i.test(lines[j].trim())){
        const l=lines[j].trim();
        const imgM=l.match(/^[-*•]\s*\*?\*?(?:Image|Visuel)\*?\*?\s*[:：]\s*(.*)$/i);
        if(imgM){currentShot.action=imgM[1].trim();j++;continue}
        const animM=l.match(/^[-*•]\s*\*?\*?(?:Animation|Mouvement\s+de\s+cam[ée]ra)\*?\*?\s*[:：]\s*(.*)$/i);
        if(animM){currentShot.camera=animM[1].trim();j++;continue}
        const dialM=l.match(/^[-*•]\s*\*?\*?(?:Dialogue|Paroles)\*?\*?\s*[:：]\s*(.*)$/i);
        if(dialM){
          const dt=dialM[1].trim();
          if(!/^\(aucun|\(musique|\(silence/i.test(dt)){
            const reps=dt.matchAll(/([A-ZÉÈÀÂÊÎÔÛÇ][A-ZÉÈÀÂÊÎÔÛÇ\s'-]+?)\s*(?:\(([^)]+)\))?\s*[:：]\s*[«"]([^»"]+)[»"]/g);
            for(const m of reps)currentShot.dialogue.push({who:m[1].trim(),line:m[3].trim(),mode:m[2]?m[2].toLowerCase():'normal',type:'synchrone',obligatoire:true});
          } else currentShot.son=dt.replace(/^\(|\)$/g,'');
          j++;continue;
        }
        const promptM=l.match(/^[-*•]\s*\*?Prompt\s+IA\*?\s*[:：]\s*(.*)$/i);
        if(promptM){currentShot.action=promptM[1].trim();j++;continue}
        const durM=l.match(/^(?:[-*•]\s*)?\*?\*?Durée\*?\*?\s*[:：]\s*(\d+)\s*(?:secondes?|s)/i);
        if(durM){currentShot.duration=Math.max(GROK_MIN_DURATION,Math.min(GROK_MAX_DURATION,parseInt(durM[1],10)));j++;continue}
        j++;
      }
      currentScene={id:uid(),acte:currentActe?currentActe.num:1,titre_acte:currentActe?currentActe.titre:'',title:'Plan '+num,summary:currentShot.action,decor:'',mood:'',chars:[],dialogue:[],son:'',img:null,busy:false,shots:[currentShot]};
      result.scenes.push(currentScene);
      i=j-1;continue;
    }
  }
  if(result.scenes.length===0)return parseFallbackFormat(text,lines);
  if(result.chars.length===0)result.chars.push({id:uid(),name:'Personnage principal',desc:'',outfit:'',role:'protagonist'});
  return result;
}

function parseTimecodeFormat(text,timecodeLines,lines){
  const result={title:'Film généré',scenes:[],chars:[],actes:[]};
  const titleM=text.match(/^#\s+(.+)$/m) || text.match(/🎬\s*Le\s*Sc[ée]nario[^\n]*/i);
  if(titleM)result.title=titleM[1].replace(/[🎬✍️📊#:]/g,'').trim()||'Film généré';
  const totalM=text.match(/Dur[ée]e\s*[:：]\s*(\d+)\s*(?:à\s*(\d+))?\s*s/i);
  const totalDur=totalM?parseInt(totalM[2]||totalM[1],10):12;
  let aiPrompt='';
  const promptM=text.match(/(?:Prompt|PROMPT)\s*(?:IA)?\s*[:：]\s*\n?([\s\S]*?)(?=\n\s*[─📊🎬✍️]|\n\s*───|$)/i);
  if(promptM)aiPrompt=promptM[1].trim();
  const audioM=text.match(/(?:Audio|Voix\s*off|Son)\s*[:：]\s*([^\n]+)/i);
  const audio=audioM?audioM[1].trim():'';
  const cameraM=text.match(/Cam[ée]ra\s*[:：]\s*([^\n]+)/i);
  const camera=cameraM?cameraM[1].trim():'static low-angle medium shot';
  const charDescriptions=[];
  const fromToM=aiPrompt.match(/From\s+left\s+to\s+right\s*:\s*([^.]+\.)/i);
  if(fromToM){
    fromToM[1].split(/,\s*(?:and\s+)?(?=(?:a|an|the)\s)/i).forEach(d=>{
      const clean=d.replace(/^and\s+/i,'').trim();
      if(clean.length>10)charDescriptions.push(clean);
    });
  }
  if(!charDescriptions.length)charDescriptions.push('Personnage principal');
  charDescriptions.forEach((desc,i)=>{
    let name='Personnage '+(i+1);
    const raceM=desc.match(/\b(British Shorthair|Maine Coon|Persian|Siamese|Tuxedo|Ginger|White|Black|Orange|Grey|Brown|Chihuahua)\b/i);
    if(raceM)name=raceM[1].charAt(0).toUpperCase()+raceM[1].slice(1).toLowerCase()+' '+(i+1);
    const accM=desc.match(/(?:with|wearing)\s+(?:a\s+)?([^,]+)/i);
    result.chars.push({id:uid(),name:name,desc:desc,outfit:accM?accM[1].trim():'',role:i===0?'protagonist':'supporting'});
  });
  result.scenes.push({id:uid(),acte:1,titre_acte:'Plan-séquence unique',title:'Scène principale',summary:timecodeLines.map(l=>l.replace(/^\s*[\d:]+\s*-\s*[\d:]+\s*[:：]\s*/,'')).join(' → '),decor:'',mood:'humorous',chars:result.chars.map(c=>c.name),dialogue:[],son:audio,img:null,busy:false,shots:[{id:uid(),num:1,duration:Math.max(GROK_MIN_DURATION,Math.min(GROK_MAX_DURATION,totalDur)),action:aiPrompt||timecodeLines.join(' | '),camera:camera,dialogue:[],chars:result.chars.map(c=>c.name),son:audio||'ambient sound',img:null,busy:false,vst:'wait',zoom_type:'aucun',zoom_cible:'aucune',zoom_vitesse:'lent',zoom_moment:'milieu',notes_realisateur:'',videoHistory:[],split:'none',subshots:[]}]});
  result.actes.push({num:1,titre:'Plan-séquence unique'});
  if(!result.chars.length)result.chars.push({id:uid(),name:'Personnage principal',desc:'',outfit:'',role:'protagonist'});
  return result;
}

function parseFallbackFormat(text,lines){
  const result={title:'Film importé',scenes:[],chars:[],actes:[]};
  const firstLine=lines.find(l=>l.trim());
  if(firstLine)result.title=firstLine.replace(/^#+\s*/,'').replace(/[🎬✍️📊#:]/g,'').trim().slice(0,80)||'Film importé';
  const visualKeywords=/(?:photorealistic|cinematic|3d|animation|shot on|prompt|style)/i;
  const action=lines.filter(l=>visualKeywords.test(l)&&l.trim().length>30).join(' ').trim()||'Scene described in source file';
  result.chars.push({id:uid(),name:'Personnage principal',desc:'Personnage principal du film',outfit:'',role:'protagonist'});
  result.scenes.push({id:uid(),acte:1,titre_acte:'Scène 1',title:'Scène principale',summary:action.slice(0,200),decor:'',mood:'',chars:['Personnage principal'],dialogue:[],son:'',img:null,busy:false,shots:[{id:uid(),num:1,duration:GROK_DEFAULT_DURATION,action:action,camera:'medium shot',dialogue:[],chars:['Personnage principal'],son:'',img:null,busy:false,vst:'wait',zoom_type:'aucun',zoom_cible:'aucune',zoom_vitesse:'lent',zoom_moment:'milieu',notes_realisateur:'',videoHistory:[],split:'none',subshots:[]}]});
  result.actes.push({num:1,titre:'Scène 1'});
  return result;
}

    if(isBinaryContent(IMPORT_PREVIEW.text))return toast('❌ Fichier binaire');

    if(!parsed.scenes.length)parsed=parseFallbackFormat(IMPORT_PREVIEW.text,IMPORT_PREVIEW.text.split('\n'));
    IMPORT_PREVIEW.parsed=parsed;
  }
  if(!parsed||!parsed.scenes.length)return toast('Aucune scène');

}

async function parsePlanWithGrok(text){
  const sys='Tu es un parseur de plan de tournage. Extrais la structure en JSON.';
  const user='Extrais :\n{"title":"","chars":[{"name":"","desc":"","role":"supporting"}],"scenes":[{"acte":1,"titre_acte":"","title":"","summary":"","decor":"","mood":"","chars":[],"dialogue":[{"who":"","line":"","mode":"normal"}],"shots":[{"num":1,"duration":6,"size":"medium","camera":"medium shot","action":"","chars":[],"dialogue":[{"who":"","line":"","mode":"normal"}],"zoom_type":"aucun","son":""}]}]}\n\nTEXTE :\n'+text.slice(0,15000);
  const raw=await chat(sys,user,8000,0.3);
  const j=J(raw);
  if(!j)throw new Error('Grok n\'a pas pu parser');
  return j;
}

  const targetId=(zone?zone.dataset.upbox:upbtn.dataset.upbtn);
  const f=find(targetId);
  if(!f){console.warn('upload: id introuvable',targetId);toast('❌ Élément introuvable');return}

  const input=document.createElement('input');
  input.type='file';
  input.accept='image/*';
  input.style.cssText='position:fixed;top:0;left:0;width:1px;height:1px;opacity:0;pointer-events:none;';
  document.body.appendChild(input);

  input.onchange=async()=>{
    const file=input.files[0];
    setTimeout(()=>input.remove(),100);
    if(!file)return;
    toast('⏳ Chargement…');
    const im=await readFile(file,1024);
    if(!im){toast('❌ Image illisible');return}
    const ok=applyImageTo(targetId,im);
    if(!ok){toast('❌ Introuvable');return}
    toast('✓ Image chargée');
    render(true);
  };
  input.oncancel=()=>setTimeout(()=>input.remove(),100);
  input.click();
},{passive:false});

document.addEventListener('input',e=>{
  const t=e.target;
  if(t.dataset.dialogues&&P){
    const f=find(t.dataset.dialogues);
    if(f){
      const lines=t.value.split('\n').filter(Boolean);
      const parsed=lines.map(l=>{
        const m=l.match(/^([^:]+):\s*(.*)$/);
        return m?{who:m[1].trim(),line:m[2].trim(),mode:'normal',type:'synchrone',obligatoire:true}:null;
      }).filter(Boolean);
      if(f.t=='h')f.o.dialogue=parsed;
      else if(f.t=='s')f.o.dialogue=parsed;
      save();
    }
    return;
  }
  if(!t.dataset.f||!P)return;
  const o=t.dataset.id=='P'?P:(find(t.dataset.id)||{}).o;if(!o)return;
  if(t.dataset.f.indexOf('fid.')===0&&o.fid)o.fid[t.dataset.f.slice(4)]=t.value;else o[t.dataset.f]=t.value;save();
  if(t.dataset.f==='split'){
    const h=o;
    if(t.value==='vertical'&&(!h.subshots||!h.subshots.length)){
      h.subshots=[{id:uid(),img:null,busy:false,vst:'wait'},{id:uid(),img:null,busy:false,vst:'wait'}];
    }
    render(true);
  }
});

document.addEventListener('change',async e=>{
  const t=e.target;
  if(t.id==='api-key-input'){KeyPool.set(t.value);toast(KeyPool.size()+' clé(s) Agnes enregistrée(s)');return}
  if(t.dataset&&t.dataset.imgprov){P.imgProvider=t.value;try{localStorage.setItem('v20_imgprov',t.value)}catch(e){}save();toast('Moteur : '+t.value);return}
  if(t.id==='import-film-file'){
    const file=t.files[0];if(!file)return;
    try{
      const {text,kind}=await readAnyFile(file);
      if(kind==='docx'){
        document.getElementById('import-film-preview').innerHTML='<div class="guide info">📄 .docx → texte extrait.</div>';
      }
      if(isBinaryContent(text))throw new Error('Fichier binaire illisible');
      IMPORT_PREVIEW={text,parsed:null,type:'film',file:file};
      const parsed=parsePlan(text);
      if(parsed.scenes.length>0){
        IMPORT_PREVIEW.parsed=parsed;
        document.getElementById('import-film-preview').innerHTML='<div class="guide go"><b>✓ Plan reconnu</b><br>'+parsed.scenes.length+' scènes · '+parsed.scenes.reduce((s,sc)=>s+(sc.shots||[]).length,0)+' plans · '+parsed.chars.length+' persos'+fidInfo(parsed)+'</div>';
      }else{
        document.getElementById('import-film-preview').innerHTML='<div class="guide warn">⚠ Format non reconnu.</div>';
      }
      document.getElementById('do-import-film-btn').disabled=false;
      document.getElementById('import-film-grok-btn').disabled=false;
    }catch(err){
      document.getElementById('import-film-preview').innerHTML='<div class="guide er">❌ '+esc(err.message)+'</div>';
      document.getElementById('do-import-film-btn').disabled=true;
      document.getElementById('import-film-grok-btn').disabled=true;
    }
    return;
  }
  if(t.dataset.duration){const f=find(t.dataset.duration);if(f){f.o.duration=parseInt(t.value,10);save()}}
});

$('#md').addEventListener('click',e=>{if(e.target.id=='md')e.target.classList.remove('on')});
